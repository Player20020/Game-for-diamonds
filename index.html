<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal v4.1 Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="game-card">
        <div class="marquee-box" style="background: rgba(0, 242, 255, 0.1); border-bottom: 1px solid var(--neon-cyan); padding: 8px; margin: -30px -30px 15px -30px; border-radius: 20px 20px 0 0; font-family: monospace; font-size: 0.7rem; color: var(--neon-cyan); overflow: hidden;">
            <marquee id="globalTicker">СИСТЕМА ИНИЦИАЛИЗИРОВАНА...</marquee>
        </div>

        <div style="position: absolute; top: 45px; right: 20px; display: flex; gap: 15px; font-size: 1.3rem;">
            <i class="fas fa-envelope" onclick="openModal('msgModal')" style="color: var(--neon-green); cursor: pointer;"></i>
            <i class="fas fa-history" onclick="openModal('historyModal')" style="color: var(--neon-pink); cursor: pointer;"></i>
            <i class="fas fa-cog" onclick="openModal('settingsModal')" style="color: var(--neon-cyan); cursor: pointer;"></i>
        </div>

        <h1 style="margin-top: 15px; font-size: 1rem;">CRYPTO TERMINAL</h1>
        
        <div class="balance-container">
            <div id="coinsDisp">0</div>
            <div style="font-size: 0.7rem; color: var(--neon-pink); letter-spacing: 2px;">CREDITS</div>
        </div>

        <div class="inventory-grid" style="background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; border: 1px solid #1a1a1a; margin-bottom: 15px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.8rem;">
                <div style="text-align: left;"><i class="fas fa-cube" style="color: #ced4da;"></i> Fe: <span id="inv-iron">0</span></div>
                <div style="text-align: left;"><i class="fas fa-gem" style="color: #2ecc71;"></i> Em: <span id="inv-emerald">0</span></div>
                <div style="text-align: left;"><i class="far fa-gem" style="color: var(--neon-cyan);"></i> Di: <span id="inv-diamond">0</span></div>
                <div style="text-align: left;"><i class="fas fa-skull" style="color: #a55eea;"></i> Ne: <span id="inv-netherite">0</span></div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button id="bonusBtn" class="btn" onclick="collectBonus()" style="padding: 15px;">
                <i class="fas fa-sync-alt"></i> ПОЛУЧИТЬ БОНУС
            </button>
            <div id="timerText" style="font-size: 0.7rem; color: #888; margin-top: 5px; font-family: monospace;">ЗАГРУЗКА...</div>
        </div>

        <div class="upgrade-box" style="border: 1px dashed var(--neon-pink); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="text-align: left;">
                    <span style="font-size: 0.7rem; color: var(--neon-pink); font-weight: bold;">АВТО-ГЕНЕРАТОР</span><br>
                    <span style="font-size: 0.6rem; color: #666;">+100 🪙 / 1 мин.</span>
                </div>
                <button id="upgradeBtn" class="btn btn-pink" onclick="buyPassive()" style="width: auto; margin: 0; padding: 5px 10px; font-size: 0.7rem;">30,000</button>
            </div>
        </div>

        <div class="slider-box">
            <select id="resourceType" onchange="calcExchange()" style="background: #000; color: var(--neon-cyan); border: 1px solid #333; width: 100%; padding: 8px; border-radius: 5px; outline: none; margin-bottom: 10px;">
                <option value="iron">Железо (300 🪙)</option>
                <option value="emerald">Изумруд (400 🪙)</option>
                <option value="diamond" selected>Алмаз (600 🪙)</option>
                <option value="netherite">Незерит (2000 🪙)</option>
            </select>

            <div style="display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 5px;">
                <span>КОЛ-ВО: <span id="diamLabel" style="color: var(--neon-pink);">1</span></span>
                <span>ИТОГО: <span id="totalCost" style="color: var(--neon-cyan);">600</span> 🪙</span>
            </div>
            <input type="range" id="diamSlider" min="1" max="100" value="1" oninput="calcExchange()">
        </div>

        <button id="buyBtn" class="btn btn-pink" onclick="executeTrade()" style="margin-top: 15px; padding: 15px;">
            <i class="fas fa-shopping-cart"></i> КУПИТЬ РЕСУРСЫ
        </button>

        <div id="receiptOverlay" class="receipt-overlay" style="display: none;">
            <div class="receipt-content">
                <h3 style="color: var(--neon-pink); margin-top: 0;">SUCCESS</h3>
                <div style="text-align: left; font-size: 0.75rem; font-family: monospace;">
                    <p>DATE: <span id="rDate"></span></p>
                    <p>HASH: <span id="rHash" style="color: var(--neon-cyan);"></span></p>
                    <p>ITEM: <span id="rType"></span></p>
                    <p>QTY: <span id="rQty" style="font-size: 1rem; color: #fff;"></span></p>
                </div>
                <button class="btn" onclick="closeReceipt()" style="margin-top: 15px;">OK</button>
            </div>
        </div>
    </div>

    <div id="msgModal" class="modal">
        <h3 style="color: var(--neon-green);">INBOX</h3>
        <div id="inboxContent" style="font-size: 0.8rem; text-align: left; background: #111; padding: 10px; border-radius: 5px; min-height: 50px;"></div>
        <button class="btn" onclick="closeModal('msgModal')">ЗАКРЫТЬ</button>
    </div>

    <div id="historyModal" class="modal">
        <h3 style="color: var(--neon-pink);">HISTORY</h3>
        <div id="historyList" style="max-height: 200px; overflow-y: auto; font-size: 0.7rem; text-align: left;"></div>
        <button class="btn btn-pink" onclick="closeModal('historyModal')" style="margin-top: 10px;">ЗАКРЫТЬ</button>
    </div>

    <div id="settingsModal" class="modal">
        <h3 style="color: var(--neon-cyan);">SETTINGS</h3>
        <div style="margin-bottom: 15px;">
            Яркость: <input type="range" min="0.5" max="1.5" step="0.1" value="1" oninput="updateBrightness(this.value)">
        </div>
        <button class="btn" onclick="openAdminDirect()">ADMIN PANEL</button>
        <button class="btn-pink btn" onclick="closeModal('settingsModal')" style="margin-top: 10px;">ЗАКРЫТЬ</button>
    </div>

    <div id="adminModal" class="modal">
        <h3 style="color: var(--neon-pink);">ADMIN AUTH</h3>
        <input type="password" id="adminPass" placeholder="ПАРОЛЬ">
        <button class="btn" onclick="loginAdmin()">ВХОД</button>
        
        <div id="adminControls" style="display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <input type="number" id="cashAmount" placeholder="Монеты">
            <button class="btn" onclick="adminAddCash()" style="padding: 5px;">ВЫДАТЬ</button>
            
            <textarea id="adminMsgText" placeholder="Новое сообщение" style="margin-top: 10px; height: 50px;"></textarea>
            <button class="btn btn-pink" onclick="adminSetMessage()" style="padding: 5px;">ОПОВЕСТИТЬ</button>
        </div>
        <button class="btn" onclick="closeModal('adminModal')" style="margin-top: 10px;">ВЫХОД</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
